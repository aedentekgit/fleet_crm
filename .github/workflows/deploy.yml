name: Deploy Rens-ERP to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  test-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ── 1. Backend Testing ──
      - name: 🧪 Install Backend Dependencies & Run Tests
        run: |
          cd backend
          npm ci --omit=dev || npm install
          npm test

      # ── 2. Frontend Building ──
      - name: 🏗️ Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      # ── 3. Production Deployment (Branch: main) ──
      - name: 🚀 Deploy Production (crm.rensdynamics.com)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Starting Production Deployment for Rens-ERP..."
            mkdir -p /var/www/crm/uploads
            mkdir -p /var/www/crm/frontend
            mkdir -p /var/www/crm/backend
            
            # Ensure upload directory permissions
            chown -R www-data:www-data /var/www/crm
            chmod -R 775 /var/www/crm/uploads

      - name: 📦 Sync Production Files to VPS
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "backend/*,frontend/dist/*,package.json"
          target: "/var/www/crm"
          strip_components: 0

      - name: 🔄 Restart Production Backend & Nginx
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/crm/backend
            npm install --omit=dev
            pm2 restart rens-crm-api || PORT=5001 pm2 start server.js --name "rens-crm-api"
            pm2 save
            nginx -t && systemctl reload nginx
            echo "Production Deployment Complete!"

      # ── 4. Staging Deployment (Branch: staging) ──
      - name: 🧪 Deploy Staging (crm.rensdynamics.com/staging)
        if: github.ref == 'refs/heads/staging'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "frontend/dist/*"
          target: "/var/www/crm/staging"
          strip_components: 2

      - name: 🔄 Reload Staging Nginx
        if: github.ref == 'refs/heads/staging'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            mkdir -p /var/www/crm/staging/uploads
            chown -R www-data:www-data /var/www/crm/staging
            chmod -R 775 /var/www/crm/staging/uploads
            nginx -t && systemctl reload nginx
            echo "Staging Deployment Complete!"
